plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.qiqi.pet'
    compileSdk 34

    signingConfigs {
        pet {
            storeFile file('../keystore/pet.p12')
            storePassword 'qiqi2026'
            keyAlias 'pet'
            keyPassword 'qiqi2026'
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        applicationId "com.qiqi.pet"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.pet
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.pet
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
