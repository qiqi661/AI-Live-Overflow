<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  body { margin:0; background:transparent; overflow:hidden; -webkit-user-select:none; user-select:none; }
  #wrap { position:relative; width:130px; height:160px; }
  #pet { position:absolute; bottom:0; left:0; width:130px; height:auto; image-rendering:pixelated; transition:transform .18s; }
  #bubble { position:absolute; top:0; left:16px; max-width:115px; background:rgba(255,255,255,.96); color:#333; border-radius:10px; padding:6px 9px; font-size:12px; line-height:1.4; box-shadow:0 2px 10px rgba(0,0,0,.16); opacity:0; transition:opacity .35s; font-family:sans-serif; word-break:break-all; }
  #bubble::after { content:''; position:absolute; bottom:-7px; left:26px; border:7px solid transparent; border-top-color:rgba(255,255,255,.96); border-bottom:none; }
  #bubble.show { opacity:1; }
  #bubble.pink { background:#ffe3ef; color:#b23a6b; }
  #bubble.pink::after { border-top-color:#ffe3ef; }
  #bubble.grey { background:#eceff1; color:#555; }
  #bubble.grey::after { border-top-color:#eceff1; }
  #bubble.red { background:#ffd9d9; color:#a11; }
  #bubble.red::after { border-top-color:#ffd9d9; }
  #bubble.green { background:#dff5e4; color:#1a6b2a; }
  #bubble.green::after { border-top-color:#dff5e4; }

  .tear, .zzz { opacity:0; position:absolute; }
  .tear { width:10px; height:14px; background:#6db3ff; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; right:38px; bottom:34px; }
  .zzz { font-size:18px; font-weight:bold; color:#4a90d9; font-family:sans-serif; right:14px; top:34px; }
  .zzz.small { font-size:13px; color:#7fb3e8; right:30px; top:14px; }

  body.happy #pet { animation:wobble 1.6s infinite; }
  body.sad #pet { transform:translateY(6px); }
  body.sad .tear { opacity:1; animation:drop 1.2s infinite; }
  body.angry #pet { animation:shake .3s infinite; filter:sepia(1) hue-rotate(-40deg) saturate(4); }
  body.sleep #pet { animation:floaty 2.6s infinite; }
  body.sleep .zzz, body.sleep .zzz.small { opacity:1; animation:floatz 2s infinite; }
  body.surprised #pet { animation:bounce .4s; }

  @keyframes drop { 0%{transform:translateY(0);opacity:0;} 30%{opacity:1;} 100%{transform:translateY(12px);opacity:0;} }
  @keyframes floatz { 0%{transform:translateY(0);opacity:0;} 30%{opacity:1;} 100%{transform:translateY(-16px);opacity:0;} }
  @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
  @keyframes bounce { 0%{transform:scale(1);} 40%{transform:scale(1.12);} 100%{transform:scale(1);} }
  @keyframes wobble { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-4deg);} 75%{transform:rotate(4deg);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-3px);} 75%{transform:translateX(3px);} }
</style>
</head>
<body class="idle">
<div id="wrap">
  <div id="bubble">咕噜</div>
  <img id="pet" src="pet.png" alt="pet">
  <div class="tear"></div>
  <div class="zzz">z</div>
  <div class="zzz small">z</div>
</div>
<script>
  var bubble = document.getElementById('bubble');
  var bubbleTimer = null;

  function setExpression(expr) {
    var cls = 'idle';
    if (expr === 'happy' || expr === 'love' || expr === 'excited') cls = 'happy';
    else if (expr === 'sad') cls = 'sad';
    else if (expr === 'angry' || expr === 'jealous' || expr === 'jealousy') cls = 'angry';
    else if (expr === 'sleep' || expr === 'sleeping') cls = 'sleep';
    else if (expr === 'surprised' || expr === 'shock') cls = 'surprised';
    document.body.className = cls;
  }

  function setBubble(text, style) {
    if (!text) { bubble.classList.remove('show'); return; }
    bubble.textContent = text;
    bubble.className = style ? style : 'normal';
    requestAnimationFrame(function(){ bubble.classList.add('show'); });
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function(){ bubble.classList.remove('show'); }, 6000);
  }

  function setPetState(s) {
    if (s && s.expression) setExpression(s.expression);
    if (s && s.bubble) setBubble(s.bubble, s.style);
  }

  function petTap() {
    var r = Math.floor(Math.random() * 4);
    var reacts = [
      function(){ setExpression('happy'); setBubble('咕噜~别戳啦'); },
      function(){ setExpression('surprised'); setBubble('咕噜？！'); },
      function(){ setExpression('happy'); setBubble('嘿嘿'); },
      function(){ setExpression('angry'); setBubble('再戳我就喷水了'); }
    ];
    reacts[r]();
    setTimeout(function(){ setExpression('idle'); }, 2500);
  }

  window.setPetState = setPetState;
  window.petTap = petTap;
</script>
</body>
</html>
